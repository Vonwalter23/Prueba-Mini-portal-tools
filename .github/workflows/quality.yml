name: Quality Gate
on:
  push:
    branches: [main, stage-3-application-scaffold]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Enforce dependency audit
        run: npm audit --audit-level=low
      - name: Diagnose dependency advisories
        if: always()
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync("/tmp/npm-audit.json", "utf8"));
            console.log("AUDIT_COUNTS", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              console.log("AUDIT_ITEM", JSON.stringify({
                name,
                severity: item.severity,
                direct: item.isDirect,
                range: item.range,
                via: item.via.map(v => typeof v === "string" ? v : {name:v.name, title:v.title, url:v.url, range:v.range}),
                fixAvailable: item.fixAvailable
              }));
            }
          '
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify GitHub Pages base-path build
        run: GITHUB_PAGES=true npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end smoke tests
        run: npm run test:e2e
